[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "qfcli"
version = "1.3.0"
description = "A CLI tool for quantitative stock analysis"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "MRX-72" }]
keywords = ["finance", "quant", "technical-analysis", "cli"]
dependencies = [
    "yfinance>=0.2.32",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
qfcli = "quant_finance.cli:main"

[tool.setuptools.packages.find]
include = ["quant_finance*"]

[tool.pytest.ini_options]
testpaths = ["tests"]